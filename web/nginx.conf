# 前端与后端并到一个 origin：这样浏览器里只有相对路径，令牌也只在 Authorization 头里走（§19.4）。
#
# 骨架期两套后端分开部署（§18.3）：对话走 agent-service，登录与管理走 management-service。
# 生产建议再加 TLS 终结、访问日志脱敏（不要记 query 里的 ticket）。

upstream agent_service {
    server agent-service:8081;
}

upstream management_service {
    server management-service:8082;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：刷新子路由不要 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 面：必须关缓冲，否则事件会被 nginx 攒着、前端看起来像「卡住了」
    location /v1/agent/ {
        proxy_pass http://agent_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        # 入场券会出现在 query 里（它不是凭证，令牌才是不许进 URL 的那个）
        chunked_transfer_encoding on;
    }

    location /v1/auth/ {
        proxy_pass http://management_service;
        proxy_set_header Host $host;
    }

    location /v1/admin/ {
        proxy_pass http://management_service;
        proxy_set_header Host $host;
        client_max_body_size 8m;   # 技能包上限 5MB，留点余量
    }
}
