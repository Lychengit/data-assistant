    real_process_evidence: "two-instance-smoke.ps1 复跑 10 项全 PASS（两台真进程、共享 PG + 共享 Redis、AGENT_WORKSPACE_STORE=jdbc）：A/B/C 与工作区共享逐项不退化，停止接口仍然幂等 200。推送这条链本身由 TurnStopChannelTest 的「真 Redis 上 A 实例推、B 实例收」用例钉住——冒烟脚本跑的是默认档，不区分「推送到得快」和「兜底等下一个事件」"
  - id: "H-10"
    title: "框架 DistributedStore 的剩余子项接入 —— 已完成（2026-09-26）：逐项核源码取证，结论是「只有一个子项值得考虑，其余都不接」"
    status: "已完成"
    deferred_because: "原判断「这些子项可能都该接线」过粗：逐项核过框架源码之后，绝大多数项都是「平台已经有更好的接线」或「框架自己就没在用」"
    resume_when: "已于 2026-09-26 完成，无需恢复；要接沙箱执行锁见 H-11"
    default_approach: "结论与逐项理由见 DR-47；唯一留口子的是 sandboxExecutionGuard（分布式互斥锁），因为它会替换掉框架自带的进程内 DockerExecutionGuard，属于「值得做但要单独评估」的一类，已拆成 H-11"
    evidence: "取证而非改代码：框架 DistributedStore.java / HarnessAgent.java / SandboxManager.java / HarnessGateway.java 逐个核过（哪些子项在「没设」时才注入、哪些根本没被消费、哪些平台的调用链压根不走）；结论表见 DR-47"
  - id: "H-11"
    title: "沙箱跨实例执行锁 —— 已完成（2026-09-26）：接框架扩展的 JdbcSandboxExecutionGuard（生产 PG 走 advisory lock），沙箱开着时默认上锁"
    status: "已完成"
    deferred_because: "原判断「先接会换掉框架自带的进程内 DockerExecutionGuard」经核实不成立：框架默认就是 SandboxExecutionGuard.noop()（**不锁**），那个类名在 2.0.3 里根本不存在，所以这是纯新增、不替换任何东西；剩下的只是代价（后到的等锁、PG 那条路占一条连接），两条都写进 L-22 了"
    resume_when: "已于 2026-09-26 完成，无需恢复；要关掉它见 agent-service.sandbox.distributed-lock"
    default_approach: "把框架扩展里现成的 JdbcSandboxExecutionGuard 挂到 DockerFilesystemSpec 上（锁语义交给方言：生产 PG = pg_try_advisory_lock，测试 H2 = 一张锁表），锁挂在「按用户」这一层、与 IsolationScope.USER 同粒度；开关 agent-service.sandbox.distributed-lock（默认 true）、等锁上限 agent-service.sandbox.lock-timeout（默认 5m）"
    evidence: "新增 5 例；全量 17 模块 BUILD SUCCESS、**431 例 0 失败**（2 例真 PG 默认跳过），且真容器 3 例真跑过。①PlatformSandboxExecutionGuardTest 3 例（**真锁**：H2 上模拟两台实例——同一用户互斥且超时错误里带锁名、不同用户不阻塞、抢不到是「等」而不是「立刻放行」）；②SandboxIsolationTest 6 例（新增 1 例用**真中间件**驱动，一条断言钉住「先拿锁 → 建容器 → 整轮跑完才松手」）；③SandboxWiringTest 11 例（新增 1 例：锁确实挂在两层装配对象上，且沙箱关着时被归一化成不带锁）"
  - id: "H-13"
    title: "事件日志滚动与保留 + 会话列表改读档案 —— 已完成（2026-09-26）"
    status: "已完成"
    deferred_because: "本轮用户点名要补的两件事：①日志文件不能只增不减（多大滚动、确认过且超过 7 天可删，都可配）；②会话列表不能每个会话各读一遍整段对话"
    resume_when: "已于 2026-09-26 完成，无需恢复；三个旋钮见 application.yml（agent-service.event-log-max-bytes / event-log-retention / event-log-maintenance-interval-ms）"
    default_approach: "裁剪只裁前缀（已确认投递 + 早于保留窗口），滚动把未确认的尾巴复制进新文件、旧文件带时间戳留档，留档到点整份删；三个动作由每个实例自己的调度器按分钟跑（maintenance = 落盘 → 裁剪 → 滚动 → 清理留档，DR-52）。会话列表另起一条轻路径：提问那一刻把标题 / 条数 / 最后提问时刻写进 platform_session，列表只读档案（DR-53）"
    evidence: "AppendOnlyEventLogTest 4→10 例（未确认一条都不裁、已确认且超期才裁且裁完位点与剩余内容都对、超上限滚动后旧文件留档且新文件只有未确认尾巴、一条都没确认时即使超上限也不滚、留档到点删而没到点的留、崩溃残留的临时文件被顺带收走）、EventLogConfigTest 5 例（默认值兜底、文件命名、留档名时间戳往返、认不出的名字返回 -1）、PlatformSessionStoreTest 6 例（第一句定标题、压平并截断、档案缺失先补、空提问不写标题、提问不碰归档标记）、AgentWebHistoryTest 1 例改 2 例（标题与条数来自提问那一刻的记录、列表不读对话正文）；全量 17 模块 BUILD SUCCESS、449 例 0 失败（2 例真 PG 默认跳过）。顺带修掉三个真问题：裁剪时位点前移量算错（用「留下的长度」而不是「删掉的前缀长度」）、位点可以回退（ack 只许前进）、maxFileBytes 配了却从未被使用"
  - id: "H-14"
    title: "观测指标目前是空壳（EventQueueMetrics.noop / LogFirstEventMetrics）"
    deferred_because: "用户明确先不做（2026-09-26）：先保证行为正确；指标接不接、接哪套（Micrometer / Prometheus）等真有看板需求时再定"
    resume_when: "要挂监控看板 / 要按指标告警时"
    default_approach: "日志类已经留好接口（EventLogMetrics：写失败、未确认积压、条数），接的时候只需要提供一个真实现并在装配处替换 noop，不用改日志代码"
  - id: "H-15"
    title: "模型调用的用量与耗时落库（首字延迟 / 总耗时 / token 用量 / 成本）"
    deferred_because: "用户 2026-09-26 先把它定为 H-02 的替代（逐字回放不做，但要补计时 + 用量），随后明确「先不做」——所以是暂缓、不是裁定不做。场景一直成立：框架每轮都把 ModelCallEndEvent 的用量与耗时递到我们手上，我们现在整个丢掉，只是不急着补"
    resume_when: "用户说做再做（它是 H-02 的替代：不要逐字内容，只要性能与成本数字）"
    default_approach: "框架的 ModelCallEndEvent 带 ChatUsage（input / output / cached / reasoning token 数，还带 time 耗时），而平台现在没有任何一处映射 MODEL_CALL（全库检索为空）。做法：翻译器加一条映射 → 平台事件（例如 MODEL_CALL_END，带 usage 与耗时）→ 走现有管线落事实表（一轮几行）；「首字延迟」用该轮第一条 TEXT_DELTA 与该轮开始时刻的时差算，不必新存逐字内容。不动会话正文，也不动历史回放"
limitations:
  - id: "L-01"
    limitation: "实例被硬杀（OOM 或 SIGKILL）时本轮不进 AgentState（框架只在 call() 结束落盘，只有优雅停机才补存）"
    mitigation: "已由 T1-08 覆盖：硬挂后历史里那一轮带中断标记，前端提示请重发"
  - id: "L-02"
    limitation: "跨实例实时的续看本轮已实现（H-01 / DR-34）；剩下的降级只有一个：总线读不到内容时（单实例 memory、老数据、总线故障或那一段已过期）退回等本轮结束再整段补——此时不是逐字出现，等满窗口仍无结果就要用户再点一次重新连接"
    mitigation: "CrossInstanceTurnRelay 的整段补兜底（DR-30 / T1-09）；权威数据始终在 AgentState，重新连接即可拿到"
  - id: "L-03"
    limitation: "工作区远端模式（P2）下 write 是 create-if-absent，文件已存在必须走 edit"
    mitigation: "已按此落地：WorkspaceSkillProvisioner.writeText 统一处理（读得到就走 edit 整段替换、读不到才 write）。H-06a 的用例先撞上了它——不处理的话技能索引永远停在第一版"
  - id: "L-04"
    limitation: "已 disableCompaction：上下文超窗会直接报错（Context overflow: no compaction configured），不会静默截断，也没有自动摘要恢复"
    mitigation: "产品侧可解释降级（提示开新会话或清空上下文），并把错误映射成用户可读文案"
  - id: "L-05"
    limitation: "调用若不带 sessionId，框架会把 sessionId 兜底成 agent 名字，导致这些调用塌缩到同一个 slot（会话串台）"
    mitigation: "所有调用必须显式带 sessionId；加断言与测试守护"
  - id: "L-06"
    limitation: "历史记录：曾经每会话建一个 HarnessAgent 且从不 close()，会持续堆积在框架静态的 GracefulShutdownManager.stateSavers 里"
    mitigation: "已由 T1-06 消除（agent 改共享实例，LRU 上限 32）；此行保留仅作历史记录"
  - id: "L-07"
    limitation: "stop 的兜底路径仍是「下一个流事件到达时」：信号键是一份状态、不是一条消息。在线实例上的停止现在是即时的（H-09 推送），只有「推送没送到」时才露出这个延迟——目标实例正好没订阅上（滚动重启、订阅刚断）、目标实例已死、或 live-bus=memory 的单实例部署"
    mitigation: "两条路并存：先写信号键（保证一定到得了）再推（保证快），见 DR-46；要连兜底都不走「下一个事件」，只能靠共享总线（live-bus=redis）让推送一定送得到"
  - id: "L-08"
    limitation: "object-storage.provider=local 时技能包只在本机磁盘上：多副本部署会出现「在 A 实例上传的技能，B 实例读不到」"
    mitigation: "多副本必须把 provider 切成 s3（管理端与 agent 侧指向同一个桶）"
  - id: "L-09"
    limitation: "投影是有损的：历史里没有逐字回放、没有过程事件（进度与心跳），工具结果只报大小不报正文"
    mitigation: "逐字回放已裁定不做（H-02 / DR-54：Codex 与 AgentScope 自家平台都不落逐字）；需要性能与成本数字看 H-15；过程事件仍可从 append-only 审计日志（事件管线）查"
  - id: "L-10"
    limitation: "ChatSession 的 seq 是实例内的：换实例或实例重启后客户端带来的游标失效，服务端退回这一轮从头补一遍"
    mitigation: "前端按 turnId 去重即可；跨实例的实时通路已由 H-01 提供（走 LiveTurnChannel，用的是总线自己的条目号游标，与本条这个内存 seq 无关）"
  - id: "L-11"
    limitation: "会话句柄有上限（agent-service.session-cache-size，默认 512，LRU 淘汰）：丢的是内存回放位，不是历史"
    mitigation: "被淘汰的会话下次请求会从状态库重新读起来，历史完整"
  - id: "L-12"
    limitation: "跨实例等待窗口（SSE 超时 - 5 秒）内没等到结果：用户看到的是这一轮还在别的实例上处理中、等待已超时，需要再点一次重新连接"
    mitigation: "只有实时总线也读不到内容时才会走到这里（H-01 / DR-34 之后已不是主路径）；结果已经落在状态库，重新连接即可整段拿到（DR-30 / T1-09）；窗口大小由 AgentServiceProperties.streamTimeout 决定"
  - id: "L-13"
    limitation: "框架 BaseStore.search(命名空间, 第一个整数, 第二个整数) 的实参含义在 JDBC 实现里是「limit 在前、offset 在后」（对应 SQL 的 LIMIT ? OFFSET ?），且第一个数为 0 时直接返回空列表（不查库）；框架自己的 InMemoryStore 读法又不一致（from = min(第二个数, size)）"
    mitigation: "平台侧按 JDBC 口径使用（列一个目录 = search(dir, 100, 0)）并在注释里写明；需要跨实现一致时以 AbstractFilesystem（ls / glob）为准，不要直接依赖 search 的参数顺序"
  - id: "L-14"
    limitation: "远端模式下框架的 WorkspaceIndex 仍是本机文件索引（工作目录下的 .index/workspace.db，一个 H2 文件库），不是共享的；它只影响列目录的本地缓存，不影响文件本体"
    mitigation: "多实例各自重建自己的索引（rebuildFromDisk），功能正确；副作用是 Windows 上用例收尾删不掉这个文件库——测试工作目录一律放 target/ 下，不要用 JUnit 的 @TempDir"
  - id: "L-15"
    limitation: "H-05 混合形态要面对的框架语义（实测，不是推断）：①路由按「前缀 + 目录边界」匹配，命中后交给对面后端的是剥掉前缀的路径（/skills/a.md → /a.md；ls 会把前缀补回来，read / write / edit 不会），前缀写成 / 则什么都匹配不到；②投影是打 tar 上传进容器 + 内容哈希去重，来源是本机目录（默认 AGENTS.md / skills / subagents / knowledge / .skills-cache），且只在沙箱 start() 时应用一次"
    mitigation: "装配与技能下发的路径口径按这个来写；要换投影源时才需要 workspaceProjectionEnabled(false) + 自带 WorkspaceSpec（见 DR-42）"
  - id: "L-16"
    limitation: "框架没有「不用 Docker 的沙箱」：2.0.3 里 Sandbox 接口只有 Docker 一个实现（sandbox/impl/docker/*）；扩展包里的 JdbcSandboxExecutionGuard / RedisSandboxExecutionGuard 是「防两台并发抢用同一隔离槽」的锁，不是执行后端。不用 Docker 也能跑命令的那条路是 LocalFilesystemSpec（产出 OverlayFilesystem，上层 LocalFilesystemWithShell 在宿主机上真起进程：Windows cmd.exe /c、其它 sh -c），它给的只有路径白名单（LocalFsMode.ROOTED + PathPolicy）+ 超时/输出上限 + 默认不继承父进程环境变量"
    mitigation: "所以「脚本执行」只有两支：容器（真隔离，能和共享工作区共存）或本机（无隔离，而且一开路由就丢 shell——见 CompositeFilesystem 的类注释）。要「无 Docker 又要有执行面」等于接受「用户脚本以 agent 服务的身份跑在宿主机上」，必须明确告知使用方；当前默认档是不执行脚本（DR-43）。除 Docker 与本机之外，框架剩下的只有「自己实现 SandboxClient + SandboxFilesystemSpec 子类」这条路（接口是开放的，但没有自带实现）"
  - id: "L-17"
    limitation: "框架默认的文件系统 LocalFilesystemWithShell 也实现 AbstractSandboxFilesystem（因为它能在宿主机上跑命令），所以 filesystem instanceof AbstractSandboxFilesystem 不能当这台实例开没开沙箱的判据"
    mitigation: "判是不是沙箱模式要看两处，且它们都是明面上的：文件系统是不是 RoutedSandboxFilesystem（开了沙箱 + 有共享库）、工具面里有没有 execute（壳工具）。用例按这两条写（SandboxWiringTest 第 1 例的注释里写了原因）"
  - id: "L-18"
    limitation: "沙箱文件系统的路径口径分两层：①命令执行的工作目录 = 工作区根（框架 docker exec -w <root>），write / uploadFiles 也把相对路径解析到工作区根，而写 /workspace 之外的绝对路径会被拒（Upload path is outside the sandbox workspace）；②read / write / delete 是把路径原样拼进 shell 命令（不像上传会做解析），全靠上面那条工作目录兜住"
    mitigation: "容器侧的路径一律用工作区相对路径（scratch/tmp.txt）。共享前缀（skills/）不受影响：它由路由交给共享库，路径口径还是老那套（带不带前导斜杠都行，SandboxWiringTest / SandboxDockerEndToEndTest 各钉了一条）"
  - id: "L-19"
    limitation: "Windows 宿主上 docker exec <容器> sh -c <命令> 会吃掉双引号的分组：sh -c echo \"a b\" 到容器里变成 echo \"a 加参数 b\"（实测输出 a；test -e \"a b\" 退出码 1），而 echo a\\ b 这种转义写法正常。PowerShell 直接调也一样，所以不是 Java 的锅，是宿主侧 docker CLI 的参数解析；Linux / WSL 宿主没这个毛病"
    mitigation: "影响的正是框架的 BaseSandboxFilesystem.write——它的检查命令里带 mkdir -p 加 $(dirname <路径>)，所以在 Windows 上往容器里写文件会失败；其余命令只要不含「双引号包住带空格的内容」都照常。本机（Windows）跑真容器用例时避开这一点（SandboxDockerEndToEndTest 改成让容器自己建文件，注释里写了原因），真正要往容器里写文件的场景在 Linux 上验"

  - id: "L-20"
    limitation: "沙箱容器是「一轮一个」（框架 SandboxManager#release 会 stop + rm --force），而框架把「工作区投影做过一次」按内容哈希记在沙箱状态里；下一轮 acquire 会 resume 上一轮的 state 并把这个哈希带进来，哈希没变就跳过投影——于是变成「第一轮容器里跑得动技能脚本、第二轮开始脚本文件不在」"
    mitigation: "平台每轮开始前清掉该 (agent, 用户) 的沙箱状态（AgentscopeRuntimeAdapter#clearStaleSandboxState），让框架按全新沙箱处理（起容器 + 应用工作区 + 重新投影）。真容器用例 SandboxDockerEndToEndTest 把这个假设钉住了（不清状态时第二轮容器里确实没有脚本、清掉后第三轮又有）；框架哪天改成「容器重建就重投影」，这一步清理就可以撤。清的是沙箱状态（框架的 _sandbox_state 槽位），不是会话状态——聊了什么在另一把键上，照样跨实例、跨轮次"

  - id: "L-21"
    limitation: "沙箱隔离「按用户分槽」这条假设已由 SandboxIsolationTest（2026-09-26）钉住：平台造出来的 SandboxContext 确实带 USER、不同用户落在不同槽位、同一个用户换会话仍是同一个槽位、甲存的沙箱状态乙读不到（把隔离粒度改成 AGENT 这几条会红，已实测）。**并发面在 H-11 之后已经有覆盖**：没有锁时同一用户并发两轮会各起一个沙箱、后写覆盖先写（用例把这个行为当事实记着）；接上锁之后那个窗口被真实抢锁用例挡住（PlatformSandboxExecutionGuardTest），并由一条「用真中间件驱动」的用例证明框架确实在**建容器之前**拿锁、在**整轮结束之后**松手"
    mitigation: "隔离本身有护栏；并发面靠执行锁（H-11 / DR-51）。仍然没验的只有「真容器 + 真并发」的端到端表现——当前默认档不开沙箱，没有暴露面，要对外开时补一条真容器并发用例即可"
  - id: "L-22"
    limitation: "执行锁的代价（H-11 之后，只在 agent-service.sandbox.enabled=true 时存在）：①同一个用户的两轮并发不再是「各起一个容器」，而是**后到的等锁**——等不到（默认 5 分钟）那一轮直接失败并报错；②生产 PG 走 advisory lock，锁挂在一条专用连接上、整轮都占着，所以**同时在跑脚本的用户数不能超过连接池大小**，超了会先把池子占满、再让别的请求排队（包括普通对话）"
    mitigation: "嫌等得久就把 agent-service.sandbox.lock-timeout 调小（调到几秒＝抢不到立刻报错，不挂着）；连接池按「同时跑脚本的用户数」配；单实例试跑或确认不需要互斥时 agent-service.sandbox.distributed-lock=false"
  - id: "L-23"
    limitation: "事件日志的三条自愈动作都只作用在「已确认投递」的那部分上：消费端长期不通（队列 / Redis 挂了）时，未确认的记录会一直堆在活动文件里——它不裁剪、也不滚动（见 DR-52 最后一条），所以这段时间磁盘占用会一直涨，保留窗口管不住它"
    mitigation: "这是刻意的取舍：宁可占磁盘也不丢事件（ADR-28）。消费端恢复后第一次维护就会把积压送走、文件随即收拢；真遇到长时间不通，该处理的是消费端本身（日志文件只是它的上游，不是原因）"
