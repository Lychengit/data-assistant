# data-assistant 改造任务台账（机器可读镜像）
# 与 doc/refactor/TASKS.md 的 id 一一对应；状态口径见 TASKS.md 第 0 节。
# 提醒机制：每次开工前先读本文件，主动汇报 status 不是「已完成」的任务与阻塞项。
meta:
  updated: "2026-09-26"
  source: "2026-09-26 设计会话（AgentScope Java v2 官方文档 + agentscope-java 源码 + 本仓库代码核查）"
  human_readable: "doc/refactor/TASKS.md"
  status_values: ["未开始", "进行中", "阻塞", "待验收", "已完成"]
  invariants:
    - "AgentScope 已有的不重复实现；框架没有的保留且不断线"
    - "会话状态权威 = AgentStateStore（PG）；会话记录权威 = AgentState"
    - "跨副本替换实例后必须能继续同一会话"
    - "技能脚本执行默认不做；要隔离就用容器沙箱，不要用本机模式（DR-43 / L-16）"

phases:
  - id: "P0"
    title: "横切与基础设施"
    done_when: "多副本不串味：限流、凭证、审计、鉴权共享；stop 可用；MinIO 可用"
  - id: "P1"
    title: "框架分布式会话管理（去重 + 状态共享）"
    done_when: "起 2 个实例验证 A / B / C 全部成立"
  - id: "P2"
    title: "暂缓项，按需启动"

goals:
  A: "断线重连（含打到别的实例）还能接着看这一轮：同实例读内存回放位；跨实例先追共享总线实时补（H-01，已实现），总线读不到再退回等本轮结束整段补"
  B: "在别的实例上继续聊（发起新一轮）"
  C: "实例挂了会话还在（真 HA）"

decisions:
  - id: "DR-01"
    decision: "分期 P0 / P1 / P2+；全部任务记入台账，未完成的必须可识别"
    rationale: "用户要求"
  - id: "DR-02"
    decision: "AgentState 权威落 PG；实现用框架扩展 agentscope-extensions-jdbc 的 JDBC 版（T1-13 之后不再自研）；不加 Redis 缓存层；不按 key 拆后端"
    rationale: "单个 JSON 文档、每轮一读一写；缓存无收益且会破坏 CAS 语义"
  - id: "DR-03"
    decision: "状态库直接用框架扩展（JdbcAgentStateStore + 按 DataSource 自动识别的方言：生产 PG、测试 H2），平台只补一处框架漏掉的按 key 删除；早前框架 CAS 非原子的结论经源码核查不成立，自研实现已删除（T1-13）"
    rationale: "框架的 CAS 是单条 UPDATE ... WHERE version = ?（看影响行数）+ 插入 ON CONFLICT DO NOTHING，是真 CAS；再自己维护一份属于重复造轮子（用户裁定：框架已有的那部分去掉）"
  - id: "DR-04"
    decision: "会话记录权威 = 框架 AgentState；不再自建会话记录"
    rationale: "去重"
  - id: "DR-05"
    decision: "Redis 缓存会话记录副本与回源回填：删除；队列落库：保留且不断线"
    rationale: "用户裁定：不重复的保留，不断线"
  - id: "DR-06"
    decision: "turn 与 HITL 快照合并进 AgentStateStore（key = platform_turn）；删 RuntimeStatePort 三件套与旧表；保留 runtime_id 校验"
    rationale: "避免重复实现寻址、CAS、清理"
  - id: "DR-07"
    decision: "每会话一个 HarnessAgent 实例改为共享实例"
    rationale: "框架口径：一个 agent 实例服务所有用户；且 build() 很重"
  - id: "DR-08"
    decision: "跨副本 turn 互斥实现框架的 SessionTurnGate 接口（平台提供 Redis 与内存两套实现，T1-14）；不用框架自带的 LocalSessionTurnGate（阻塞式公平信号量，会把 HTTP / SSE 请求挂住好几分钟）；CAS 仍是正确性底线"
    rationale: "框架 2.0.3 确实有 SessionTurnGate；但它的本地实现语义是排队等而不是抢不到就说，与平台当场告诉用户上一轮还在处理中的口径相反"
  - id: "DR-09"
    decision: "A 先降级；跨副本实时列为独立任务 H-01（已于 2026-09-26 完成，形态见 DR-34：平台实现框架 MessageBus 接口，不是接线框架自带实现）"
    rationale: "不与 P1 混期"
  - id: "DR-10"
    decision: "前端历史从 AgentStateStore 投影；conversation_* 事实表照旧由事件管线写"
    rationale: "去重的必然结果"
  - id: "DR-11"
    decision: "不设 maxContextTokens；同时产品侧要处理「关闭 compaction 后上下文超窗直接报错」"
    rationale: "核查纠正：该参数是工作区上下文注入预算（默认 8000），不是模型上下文上限；超窗是报错而非静默截断"
  - id: "DR-12"
    decision: "框架工作区平面保持关闭；P2 加技能与沙箱时不得顺手打开"
    rationale: "避免三套聊天记录与远端日志写放大"
  - id: "DR-13"
    decision: "stop 停单轮、保留已产出、状态 canceled、幂等、跨副本靠自建信号通道"
    rationale: "框架 interrupt 不持久化、不跨副本"
  - id: "DR-14"
    decision: "网关与 agent-service 统一拦截器与线程上下文；UserContext 显式传入 agent 执行链"
    rationale: "控制器保持干净；线程池会丢 ThreadLocal"
  - id: "DR-15"
    decision: "网关保持 Spring MVC 架构不变；agent-service 信任网关签名的身份，不再自己解 JWT"
    rationale: "消除两套身份来源"
  - id: "DR-16"
    decision: "MinIO 原生安装；对象存储走 ObjectStorage 端口与 S3 兼容默认实现"
    rationale: "决策时本机 Docker 起不来（现已修好）；便于将来换云对象存储"
  - id: "DR-17"
    decision: "删除系统提示词里的数据范围表述；interface-doctor 的范围过滤 TODO 保持"
    rationale: "该能力尚未落地"
    followup: "2026-09-26 全仓复核：注释层面按旧口径描述现状的几处（AgentServiceApplication / CanonicalRequest / V1-V6 迁移注释）也一并清掉，见 TASKS.md §6「数据范围残留复核」"
  - id: "DR-18"
    decision: "文档与 ADR 同步修订；唯一事实源表述改为审计用、会话状态权威是 AgentStateStore"
    rationale: "原提法与框架权威定义冲突"
  - id: "DR-19"
    decision: "token 级默认不落 PG（H-02 已于 2026-09-26 裁定为「不做逐字回放」，要的是计时与用量，见 DR-54 / H-15）"
    rationale: "削峰；模型可见的是消息与工具结果，不是每个 token"
  - id: "DR-20"
    decision: "P2 工作区 BaseStore 默认 PG 与 JDBC"
    rationale: "Redis 在 noeviction 下不能被长期文件撑满"
  - id: "DR-21"
    decision: "每轮工具清单改用框架原生机制：全部工具完整编组 + 每轮设置会话 ToolContextState 激活组 + 需要硬撤销时叠加 per-slot DENY 规则；禁止每轮 registerAgentTool/removeTool"
    rationale: "Toolkit 是 agent 级全局可变；ToolRequestConfig 无法选出本工具子集；onReasoning 过滤不是执行闸门"
  - id: "DR-41"
    decision: "技能内容下发用「DB 认版本 + 对象存储取字节 + 工作区放文件」：管理端是唯一写者（sys_skill_version.status=published 是唯一权威）；agent 侧只读这一张表拿 storage_key，去对象存储取包，解包后写进该用户的工作区（H-04 的共享 store，IsolationScope.USER 天然按人隔离）。不开新接口、不新增跨服务鉴权面、不在 DB 里存第二份技能内容"
    rationale: "任何实例都自给自足（无单点）；哪一版算数只有一处判断；技能按人隔离直接复用工作区命名空间。一个技能只维护一个最新可用版本：历史版本行只留档、不参与下发，不做版本并存、不做回滚"
    followup: "2026-09-26 已按此落地（H-06a）：agent 侧 RegistrySkillPackageSource 只读 sys_skill_version 取 storage_key + 读对象存储；WorkspaceSkillProvisioner 写进该用户工作区 skills/；发现与按需读正文全用框架自带的 WorkspaceSkillRepository。见 TASKS.md §6「H-06a 落地说明」"
  - id: "DR-42"
    decision: "H-05 沙箱形态（已实测选定，2026-09-26）：走「沙箱当主 + PG 走路由 + 技能投影进容器」——文件读写落 PG（多实例共享），命令执行落容器（隔离），容器里要用的技能由框架的投影机制打 tar 进去（内容哈希去重）。两条硬约束：①路由前缀必须逐个枚举，写成 / 一把梭什么都匹配不到（框架会把两侧开头斜杠都剥掉，空前缀只剩「精确等于 /」这一种匹配）；②框架默认投影源钉在「本机工作目录」，必须 workspaceProjectionEnabled(false) + 自带 WorkspaceSpec 才能换成我们自己的来源"
    rationale: "用户选定混合版（原话：工作区仍然共享在 PG，只在要执行脚本的时候把技能投影进容器里跑）。不是纸面推断：两个用例实测过——SandboxFilesystemRoutingTest 6 例（假沙箱后端，钉住 execute 永远落沙箱、命中前缀的读写落路由后端、前缀被剥掉后的路径口径、前缀写 / 匹配不到任何路径）；DockerSandboxSpikeTest 1 例（真起 ubuntu:22.04 容器，钉住投影源能被自己的 WorkspaceSpec 接管、命令真在容器里跑、投影进去的脚本容器里读得到）。框架把这条路写成了正经用法：RoutedSandboxFilesystem 的类注释原文就是「保留 primary 沙箱后端上的 shell 执行」"
  - id: "DR-43"
    decision: "技能脚本「执行」默认不开 Docker（2026-09-26 定档）：H-06b 的默认档 = 技能只下发内容、不执行脚本（技能正文 + 资源文件进工作区，模型按需读）；Docker 沙箱（DR-42 的形态）降级为可选升级档、默认关着。为什么不选「本机跑」（LocalFilesystemSpec）：①框架没有「不用 Docker 的沙箱」，本机模式是「在宿主机上真起进程 + 路径白名单」，限的是路径不是权限，脚本仍以 agent 服务自己的身份读环境变量 / 网络 / 文件，不构成多租户隔离；②本机模式和共享工作区凑不到一起：框架只在「沙箱当主」时才用 RoutedSandboxFilesystem 保 shell，本机当主 + 路由会被包成 CompositeFilesystem，shell 执行能力直接消失（HarnessAgent.Builder.build() 明确分叉，CompositeFilesystem 类注释原文：Shell execution is intentionally not supported in this mode）"
    rationale: "用户口径是「能用框架的别自己造 + 与框架重复的去掉」：分布式会话、共享工作区已经用框架能力拿到；脚本执行是唯一还需要额外基础设施（容器）才换得到隔离收益的部分，收益与复杂度不成比例时先不做。不做执行面 = 少一层要运维的容器，也不用为它做生命周期管理。取证过程见 TASKS.md §6「脚本执行：不用 Docker 的那条路」"
  - id: "DR-44"
    decision: "H-05 沙箱的装配形态（2026-09-26 落地）：Builder.filesystem(DockerFilesystemSpec) 当主 + Builder.filesystemRoute(skills/, 共享库文件系统)；路由表由 SandboxSharedRoutes 复用框架的 RemoteFilesystemSpec 生成，于是同一份技能在共享库里的键位与 H-04 远端模式逐字相同。放行框架的壳工具 ShellExecuteTool（开关打开后唯一故意偏离 ADR-31 基线的地方，所以必须显式打开）；关掉框架默认投影（workspaceProjectionEnabled(false)——它扫的是这台机器的工作目录，多副本下来源不确定）；显式写死 IsolationScope.USER（框架的兜底值不会回填到 SandboxContext 上，隔离粒度不能靠兜底）；容器快照沿用框架默认的 noop"
    rationale: "用户口径是混合版：工作区仍然共享在 PG，只在要执行脚本的时候把技能投影进容器里跑。本轮落地的是前半段（共享 + 隔离的执行场所）；把技能投影进容器、让脚本在容器里闭环执行当时仍归 H-06b（DR-43 默认不做，已于 2026-09-26 由 DR-45 补齐）。为什么那一期沙箱模式下也不开投影：投影源是本机目录，多副本下每台机器内容不同，等于让技能从哪来变得不确定；技能正文的权威始终是共享库（H-06a）"
    followup: "2026-09-26 落地：SandboxSettings + SandboxSharedRoutes + StartupSandboxCheck + AgentServiceConfig 接线 + application.yml 开关（agent-service.sandbox.*，默认关）；用例 SandboxWiringTest 7 例（不需要 Docker）、SandboxDockerEndToEndTest 1 例 + DockerSandboxSpikeTest 1 例（真容器）、StartupSandboxCheckTest 3 例。见 TASKS.md §6「H-05 落地说明」与 README「沙箱（H-05）」。技能投影进容器那半段（H-06b）已于同日由 DR-45 补齐"
  - id: "DR-45"
    decision: "H-06b 的装配形态（2026-09-26 落地）：每轮三步——清沙箱状态、技能抄到本机、把本轮的 SandboxContext 放进 RuntimeContext，技能于是被框架投影进容器。①抄到哪：平台自己的 workspace-dir 下的 sandbox-skills/<用户>/，每个用户一份，内容是共享库 skills/ 的镜像（同步而非重建：内容一样就不写、共享库里没有的删掉）；②怎么让框架用我们的来源：每轮现造 SandboxContext（spec.toSandboxContext(stagingRoot)）放进 RuntimeContext，框架的 ensureSessionDefaults 会拿它覆盖 agent 上的默认值；③为什么先清沙箱状态：容器一轮一个，而框架把「投影做过一次」按内容哈希记在沙箱状态里，不清就会「第一轮跑得动、第二轮文件没了」（真容器实测，见 L-20）"
    rationale: "投影源必须是宿主本地目录——框架的 WorkspaceProjectionApplier 用 Files.readAllBytes 读源、只收 isRegularFile，不认共享存储；所以先在本地摆好再交给框架打 tar 灌进容器，框架自己给中心化技能用的 MarketplaceStager 也是这个套路。为什么每轮都抄：技能可见性来自网关授权、随时会变（H-06a 也是每轮跑），而容器只在它活着的时候存在，所以每轮重新同步。为什么投影要落在 <workspaceRoot>/skills/：框架提示词里给模型的路径就是 <workspaceRoot>/skills/<技能>，投影路径必须与之一致，否则模型会照着一个容器里不存在的路径去跑脚本"
    followup: "2026-09-26 落地：SandboxSkillStaging + AgentscopeRuntimeAdapter#prepareSandbox / #clearStaleSandboxState + SandboxSettings#toProjectingFilesystemSpec + WorkspaceSkillProvisioner 的脚本提示语按沙箱分岔；用例 SandboxSkillStagingTest 3 例（不碰 Docker）、SandboxWiringTest 10 例、SandboxDockerEndToEndTest 2 例（真容器）。见 TASKS.md §6「H-06b 落地说明」"
  - id: "DR-46"
    decision: "H-09 形态：stop 从「拉」改「推」，但只在框架总线上加一个「推送口」（TurnStopChannel，2026-09-26 落地）。发布顺序是「先写信号键、再推一条」，两条路并存：信号键（带 TTL）负责「一定到得了」，推送负责「快」——订阅方收到就当场取消本地那一轮，不用等下一个流事件。底座直接用框架的 MessageBus（H-01 那条 live-bus），不自己写 Redis Pub/Sub；live-bus=memory 时推送自然退回「等下一个事件」"
    rationale: "用户口径是「能用框架的别自己造」：H-01 已经把框架 MessageBus 接口 + 订阅容器 + 停机做完了，停止只是复用同一条总线多开一个频道，没有第二套连接要运维。为什么不让信号键直接消失：广播是尽力而为，订阅方可能正好没订阅上（滚动重启、网络抖动），信号键是兜底，保证「最迟下一次推进事件时也会停」；反过来只靠信号键就是原来那个延迟问题。为什么推送要带 turnId：一个用户可能同时有别的会话/轮次在跑，只有（用户、会话、轮次）三元组全对上才是「停我这一轮」，对不上就静默忽略——广播下「不是我的」是常态，不是异常（记日志只会变噪音）"
    followup: "2026-09-26 落地：TurnStopChannel（频道 agent-service:turn-stop，订阅者可多个、发布失败只告警）+ ChatService.stop() 写完信号键后推一条 + onPushedStop 收到即取消（三问过滤）；没有新增开关，推送跟着 live-bus 走。用例 ChatServiceTest 14→16 例（刻意不推任何流事件也能当场停、推送里不是本实例这一轮时不受影响）、TurnStopChannelTest 4 例（含 1 例真 Redis：A 实例推、B 实例收）。见 TASKS.md §6「H-09 落地说明」"
  - id: "DR-47"
    decision: "H-10 结论（2026-09-26 逐项核框架源码取证）：DistributedStore 的那些子项，除「沙箱执行锁」外一律不接。①agentStateStore / baseStore：平台已有显式接线（T1-13 的 JDBC 状态库、H-04 的 filesystem(RemoteFilesystemSpec)），框架的 injectStoreIfAbsent 只在「没设」时才注入，走聚合不会改变现状；②sandboxSnapshotSpec：框架默认就是 NoopSnapshotSpec，显式写 noop 与现状逐字一致；③messageBus：H-01 平台自建实现已在用，聚合接线拿不到额外能力；④asyncToolRegistry：框架只是透传赋值、没有消费点，且平台不用异步工具（ADR-31）；⑤taskRepository：只在为空时才建 WorkspaceTaskRepository，而平台不用后台任务/子代理（ADR-31），接了等于给「开后台任务」铺路；⑥sessionTurnGate：框架那个接线目标是 HarnessGateway，而平台的调用链走 agent.streamEvents(...)，gateway 那条路根本没被用到，平台自己的 SessionTurnGate（T1-14）已经在接入层生效；⑦teamClient：团队功能平台关闭"
    rationale: "「不接」不是省事，而是每一项都能说清「接了会换掉什么、换来的能力平台用不用得上」。唯一例外是 sandboxExecutionGuard：框架 Docker 客户端自带 DockerExecutionGuard（进程内），显式接分布式实现会把它替换掉——现有隔离槽是 IsolationScope.USER（跨实例同一个用户可能抢同一个槽），换成分布式互斥锁是正确性增强，但当前默认档不开沙箱、USER 槽位默认串行，收益小、风险是换掉框架自带那层，所以列为可选接线（H-11）而不是本轮就换"
    followup: "2026-09-26 取证完成，未改代码。附带发现：框架 PeriodicGate（孤儿清理门）不读 DistributedStore.sessionTurnGate()，而是按 distributedStore != null 走 StoreBackedPeriodicGate(distributedStore.baseStore())，与本平台的闸门无关"
  - id: "DR-48"
    decision: "停止一律**带会话身份**喊停（agent.interrupt(userId, sessionId)），不许用无参的 agent.interrupt()——框架已经把无参那个标了 @Deprecated，它打的是默认槽位 (null, defaultSessionId)；而平台的每一轮都跑在自己的 (userId, sessionId) 槽位上，喊错槽位等于没停"
    rationale: "这是实测踩出来的：无参版本下，停止返回 200、界面也确实停了（平台自己标记本轮结束、放掉坑位、记一条停止事件），但模型把整轮答案一个词不少地产完——烧 token、工具照跑，违反 TCK-4「取消后不得再产生任何工具调用与模型调用」。为什么读代码发现不了：两边看起来都叫「调用了框架的停止」，只有真跑一个慢模型、数一数停止之后还产出多少，才能区分。根因是框架的打断标记挂在**会话状态**上（AgentState.interruptControl()），本轮循环读到的是自己那份，所以必须打到对应槽位"
    followup: "2026-09-26 修复：AgentscopeRuntimeAdapter#cancel 改为带身份调用；新增 TurnInterruptTest 2 例（停止之后不再产出、停一个会话不牵连共用同一个 agent 的另一个会话）。把实现改回无参版本这两例会红（已实测），所以它是一条真护栏，不是装饰。顺带做了同类审计：打开 javac 的 -Xlint:deprecation 全量编译 agent-service 的四个模块，0 条废弃用法——说明没有第二处「喊错槽位」的调用"
  - id: "DR-49"
    decision: "停止之后**不提供**「从断点继续」（2026-09-26 用户裁定不做）：停掉就是停掉，用户再发一句是新一轮——模型看得到之前那半句，所以是「接着聊」，不是「接着写」"
    rationale: "框架没有「恢复同一轮」的接口，只有 HITL 挂起/恢复那条路（平台已经用在「工具调用需要确认」上）。真要做得自己保留挂起快照 + 另加续跑入口，而语义上模型是「看到半句再重写后半段」——既不是逐字续传，也不保证与「从没停过」一致，产品上换不到清晰的价值；重新提问更直白"
  - id: "DR-50"
    decision: "H-08 调研结论（2026-09-26）：AG-UI 不替换自研 SSE 层 —— §12.2 的事件契约与权威面继续留在平台侧"
    rationale: "三条硬事实。①它是前端事件协议：事件集是 RUN_STARTED / TEXT_MESSAGE_* / TOOL_CALL_* / STATE_* / REASONING_* 这一套，回答的是「同一个进程里怎么把事件画到前端」；而 §12.2 的业务事件里，intent / skill_start / skill_step / sandbox_job / artifact 与 clarify（缺哪些槽）在 AG-UI 里没有语义位，只能塞进它的 CUSTOM，final 的溯源标注 / figures / expressions 同理 —— 换过去等于给自研事件套一层壳，代价是第二套协议、第二套依赖，收益是零。②它不管平台已经做完的那一面：状态权威与持久化（AgentStateStore）、跨副本实时续看（H-01）、跨副本轮次互斥（T1-07 / T1-14）、一次性入场券、限流、审计、HITL 工具确认的回执关联、GET /sessions 与 /sessions/{id}/turns 与 /sessions/{id}/stop —— starter 只暴露两个 POST 入口（/agui/run、/agui/run/{agentId}），别的接口一个都没有；它自带的 server-side memory 是进程内 ConcurrentHashMap（ThreadSessionManager 按「用户 + 线程」分槽），多副本不共享 —— 恰好就是我们要解决的那件事。③它的 SSE 没有断线续传的钩子：MVC 那条用 SseEmitter.event().data(json, APPLICATION_JSON)、WebFlux 那条用 ServerSentEvent.builder().data(...)，两处都没有 .id(...)，也就是既没有 event 名也没有事件 id，客户端拿不到 Last-Event-ID 回来补洞 —— 而 §12.2 明确要求断线续传（平台已由 H-01 的总线游标满足）；再加它默认 interruptOnDisconnect=true（订阅端一断开就把这一轮打断），与「断了换一台实例接着看」正好相反。"
    followup: "两条不构成否决、但要知道的事。①依赖面：starter 的 pom 把 spring-boot-starter-web / webflux / configuration-processor 都声明成 4.0.3，而项目主线是 Boot 3.4.1；项目现在只用 agentscope 的 core / harness / extensions，从没用过它的 spring-boot starter，所以 AG-UI 会是第一个 Spring Boot 集成依赖。根 pom 的 spring-boot-dependencies BOM 会把版本压回 3.4.1，能否在 Spring Framework 6.2 上正常跑没有实测（jar 只声明 Java 17），这是一条未验证的兼容风险；结论不依赖它 —— 能力缺口已经足够决定。②事件词汇表本身对得上：STEP_STARTED / TOOL_CALL_* / REASONING_* / TEXT_MESSAGE_CHUNK 与 §12.2 的 step / tool / 思考流 / token 基本能一一对应；它的 HITL 语义也齐（permission_confirm / input_required / tool_call 三种原因，加下一次请求带回 resume{interruptId, status}）。所以将来真要接 AG-UI 生态时路是通的 —— 但那是「多开一个通道」，不是「替换掉现在这个」。"
  - id: "DR-51"
    decision: "H-11 形态（2026-09-26 落地）：沙箱执行锁接框架扩展的 JdbcSandboxExecutionGuard，**锁的后端跟着数据库方言走**，并跟着沙箱开关默认打开"
    rationale: "四点。①不接 DistributedStore 那条聚合接线：那要求把 agentStateStore / baseStore 等一起交给框架聚合，而平台这三样都已经显式接好了（T1-13 的状态库、H-04 的工作区库），为一个锁换整条接线不划算——框架也允许只挂锁，DockerFilesystemSpec.executionGuard(...) 就是它 javadoc 里的用法（HarnessAgent 只在我们没给锁时才去问 distributedStore）。②用 JDBC 版而不是 Redis 版：本模块本来就有 DataSource，Redis 版要 redis.clients.jedis.UnifiedJedis，为一个锁引 Jedis 不划算；而且「按数据库挑实现」这件事框架已经做了——方言自己就是锁策略，于是同一份平台代码在生产走 pg_try_advisory_lock（锁在连接上，进程崩了自动松）、在测试走表锁。③锁挂在用户这一层：沙箱槽位就是按用户分的（IsolationScope.USER），锁与被保护的东西必须同粒度，否则要么挡不住、要么误伤别人。④默认打开：它防的是**静默失败**（同一用户并发两轮各起一个容器、后写的状态覆盖先写的，不报任何错）；沙箱关着时锁不存在（归一化成 null），所以默认档行为不变。代价如实记在 L-22。"
    followup: "顺带修正 DR-47 里的一句话：那里写「框架 Docker 客户端自带进程内的 DockerExecutionGuard」，核实后**不成立**——2.0.3 里没有任何 DockerExecutionGuard，SandboxExecutionGuard 的默认值就是 noop，harness 的 docker 包里只有 Sandbox / Client / State / Spec 那几件。所以 H-11 之前那条「会替换掉框架自带保护」的风险不存在。另一条实测事实也记下来：**松锁发生在框架的 SandboxLifecycleMiddleware**（顺序是 SandboxManager.release → lease.close()），不在 SandboxManager.release 里——写用例时若自己手写 release 而不经过中间件，会得到「只拿不还」的假象（本轮真的踩到过）。"
  - id: "DR-51b"
    decision: "顺带修正 DR-47 里的一句错话（2026-09-26）：那里写「框架 Docker 客户端自带进程内的 DockerExecutionGuard」，核实后**不成立** —— 2.0.3 里没有任何 DockerExecutionGuard，SandboxExecutionGuard 的默认值就是 noop（不锁），harness 的 sandbox/impl/docker/ 里只有 Sandbox / Client / State / Options / Spec。所以 H-11 是**纯新增**，那条「会替换掉框架自带保护」的风险不存在"
    rationale: "另一条实测事实：**松锁是框架的 SandboxLifecycleMiddleware 做的**（顺序 SandboxManager.release → lease.close()），不在 SandboxManager.release 里 —— 写用例时若自己手写 release、不经过中间件，就会录到「只拿不还」的假象（本轮真踩到过）。这两条都是「读代码 + 跑用例」得到的，不改行为、只改认知，详见 TASKS.md §6「H-11 落地说明」"
  - id: "DR-22"
    decision: "共享单例 agent 必须配套有界内存：每轮结束清理该 slot 的 stateCache"
    rationale: "stateCache / slotVersions / permissionEngineCache 无 LRU 无上限；有 store 时每次调用都会重新加载状态，清理是安全的"
  - id: "DR-23"
    decision: "熔断保持实例内计数，不做跨副本共享；其余内存态（限流、入场券、nonce、停止信号）一律共享"
    rationale: "熔断是保护下游的本地动作，各台独立开合不会串味，也不需要全局一致；共享反而每次转发多一次 Redis 往返，还要定义谁负责复位计数。限流与凭证恰恰相反：各数一份会被放大成副本数×额度，是正确性问题"
  - id: "DR-24"
    decision: "MinIO 社区版已归档（dl.min.io 一律 410 Gone）→ 本机装 GitHub Releases 上最后一个开源版本 RELEASE.2025-09-07T16-13-09Z（按官方 SHA256 校验），明确只用于开发；生产换仍在维护的 S3 兼容对象存储"
    rationale: "官方不再分发与维护社区版；对象存储已按 ObjectStorage 端口抽象（T0-08），换实现不动业务代码"
  - id: "DR-25"
    decision: "共享文件走 ObjectStorage 端口，实现由 object-storage.provider（local / s3）在装配期决定；业务只认端口。S3 实现不自动建桶、putIfAbsent 先查后写、list 分页到底"
    rationale: "本机开发不该被中间件绑架（local 够用），多副本必须有共享存储（s3）；桶是运维资产，应用偷偷建桶会把数据放到没人预期的位置"
  - id: "DR-26"
    decision: "对象存储里业务自带路径前缀（如技能包 skill-packages/），配置里的 key-prefix 只用于环境隔离"
    rationale: "两层前缀职责不同：一层是业务分类、一层是部署隔离，混在一起以后没法按前缀设生命周期策略"
  - id: "DR-27"
    decision: "版本 CAS 交给框架扩展（T1-13），不再由平台自研 SQL；平台唯一自己写的 SQL 是按 key 删除，而且直接复用框架方言里现成的 sessionStateDeleteByKey 语句，不手写"
    rationale: "自研 CAS 已被证明是重复实现（框架那份同样正确）；手写 SQL 一旦带上方言特性，测试库与生产库就会变成两套语义"

  - id: "DR-28"
    decision: "历史 = AgentState 的投影，不再另存会话台账；会话档案 platform_session 只存算不出来的字段（建档时刻与归档标记）"
    rationale: "存两份就有两个真相；标题、提问条数、最后活跃时间都能从状态现算"
  - id: "DR-29"
    decision: "框架写死的存储键 agent_state 是显式耦合点；AgentScope 升级必须先跑 AgentStateContractTest"
    rationale: "历史完全寄托在框架状态文档结构上，框架改结构会变成历史全空这种静默故障，需要护栏用例"
  - id: "DR-30"
    decision: "跨实例接流降级为等本轮结束再整段补（CrossInstanceTurnRelay）：轮询共享状态库，等这一轮落盘后一次性补齐；等待窗口 = SSE 超时 - 5 秒，每秒看一次"
    rationale: "轮询读的是状态库投影，天然跨实例、不需要额外中间件，也不会引入事件总线连没连上这种新失败模式；实时推送属于 H-01（已由 DR-34 落地：平台实现框架 MessageBus 接口），不与 P1 混期"
  - id: "DR-31"
    decision: "接流票据 EntryTicket.turnId 允许空串（= 不指定轮次）；换券时若本机没有这一轮，就从共享的开始标记 platform_turn_live 里取轮次号"
    rationale: "一次性券是跨实例核销的：发券的实例与接流的实例可能不是同一台，票据里没带轮次号时不能当成没有可续看的"
  - id: "DR-32"
    decision: "把框架 MessageBus 的 Redis 实现接成 DistributedStore.messageBus()，用它支撑跨副本实时续看（原 H-01）；框架 2.0.3 自带 DistributedStore 一站式接口（agentStateStore / baseStore / sessionTurnGate / messageBus / asyncToolRegistry / 沙箱快照与执行锁），HarnessAgent.Builder.distributedStore 会自动接线"
    rationale: "这一条把 H-01 从需要自研降级为需要接线；后续 H-03 / H-04 / H-05 / H-06 也很可能同样变成接线而不是造轮子（见 H-10）。（修正：见 DR-34 —— 框架只带 WorkspaceMessageBus、没有 Redis 实现，平台接入层也没走 HarnessAgent.Builder.distributedStore；H-01 的实际形态是按框架接口自己写实现）"
  - id: "DR-33"
    decision: "数据范围归接口服务：网关只判定接口可用性（apiSet）并下发身份（userId + requestId）与签名，不算也不下发范围；范围由接口服务基于登录人自行推导（推导不出来即 403）；列级没有白名单，返回哪些列由接口自己的 SQL 与返回类型写死"
    rationale: "用户拍板（2026-09-26）：范围是业务表结构 + 登录人的知识，只有接口服务具备；让权限库猜业务表结构，接口一复杂就得改权限库。规格书写进 ADR-37（台账 T1-16）"
  - id: "DR-34"
    decision: "跨副本实时续看（原 H-01）由平台实现框架 MessageBus 接口：RedisMessageBus（默认）/ InMemoryMessageBus 两套实现，平台用 LiveTurnChannel 收口读写，CrossInstanceTurnRelay 先按游标追日志拿实时内容、追不到再退回等落盘整段补；不接进 HarnessAgent.Builder.distributedStore（agent 内部那条总线是关闭的）"
    rationale: "① 纠正判断：框架只带 WorkspaceMessageBus（写工作区文件系统、服务 agent 内部），没有 Redis 实现，DR-32 的接线活不成立；② 用框架接口而不是自造一套：语义（会话事件流 + 游标）正好复用 sessionPublishEvent / sessionReadEvents，将来框架补上 Redis 实现可原样替换；③ 追日志不订阅：我已经错过了一段是重连场景的常态，订阅在断线那一瞬就丢消息，追日志按游标自愈；④ 实时只是加速不是权威：总线带 TTL，写失败只 warn，权威始终是 PG 的 AgentState；⑤ 无人管了的判定与整段补只在 CrossInstanceTurnRelay 一处决定，避免同一段下发两遍"

  - id: "DR-39"
    decision: "工作区共享（原 H-03 / H-04）用框架的 JdbcStore + PG（RemoteFilesystemSpec），不引入阿里云 OSS SDK；隔离范围取 USER；开关 agent-service.workspace-store（none 默认 / jdbc），改这一项不动代码；平台侧 PlatformWorkspaceStore 只是一处装配点，不包装饰器、不改写框架 SQL"
    rationale: "① 平台的对象存储栈是 AWS SDK v2 S3，而框架的 OssBaseStore 只认阿里云 OSS——直接用要么硬拉一个新 SDK、要么把两套对象存储语义混在一起；② 框架的 JdbcStore 已经把 CAS、前缀搜索、错误翻译做全了，再包一层就是重复造轮子；③ 默认 none：工作区平面按 DR-12 还关着，开了只会多一次库往返而没人用，等 H-06（技能下发）用上再切"
  - id: "DR-40"
    decision: "工作区共享与会话状态共享必须同时成立：框架在 HarnessAgent.build() 里检查到 AgentStateStore 是本进程实现（JsonFileAgentStateStore / InMemoryAgentStateStore）就直接抛错、拒绝装配远端文件系统；平台对应口径是两个都落 PG（PlatformAgentStateStore + PlatformWorkspaceStore）"
    rationale: "文件是同一份、状态各是各的这种半分布式组合在多副本下必然错乱（A 机器写的工作区、B 机器带着自己的旧状态去读），框架直接禁止比运行期出错好；平台本来就用 JDBC 状态库，这一条只是把为什么两者绑在一起写下来，并加一条用例钉住"
  - id: "DR-52"
    decision: "本地事件日志不再只增不减，按两个条件收拾：①「已确认投递」且早于保留窗口（默认 7 天，可配）的记录裁掉；②活动文件超过单文件上限（默认 256 MB，可配）就滚动——旧文件带时间戳留档、新文件只装未确认的尾巴；留档到点整份删。未确认投递的记录一条都不删、也不滚"
    rationale: "日志是审计的唯一事实源，但「唯一事实源」不等于「无限长」：一个实例连着跑，那个文件会一直长到把磁盘占满，撑爆之后连追溯都做不了。三条规矩都绕着同一件事——没送进队列的绝不能丢：裁剪只裁前缀（裁中间会让字节位点失去意义）；滚动时未确认的尾巴复制进新文件再留档旧文件（那几条因此在磁盘上短暂存在两份，靠消费端按 event_id 幂等兜住）；一条都没确认时干脆不滚（滚了只是把文件整个复制一遍，还会每分钟再造一份）。维护由每个实例自己的调度器按分钟跑，只碰自己的文件，不需要分布式锁"
  - id: "DR-53"
    decision: "会话列表改读「会话档案」（platform_session 里的标题 / 条数 / 最后提问时刻），不再读对话正文；历史回放（/turns）照旧读框架的 AgentState。那三个数在提问的那一刻写进档案"
    rationale: "原来打开一次列表要把每个会话的整段对话读出来，只为算标题、条数与最后活动时刻——一个用户几百个会话就是几百次大对象读。而提问那一刻平台手上就有全部事实（标题就是用户刚打的那句话），记下来最省。口径上说清「档案是索引、正文是真相」：档案允许落后（例如绕过平台直接往状态库塞过对话），落后可自愈（再问一句就跟上），而历史回放一个字都不来自档案"
  - id: "DR-54"
    decision: "逐字回放不做（H-02）：token 级增量只在流里走、不落库；真正该补的不是逐字内容，而是「计时 + 用量」——另开 H-15（首字延迟 / 总耗时 / token 用量 / 成本）"
    rationale: "①先看同类产品怎么做：Codex 自己的会话记录（本机 37 个 rollout 文件逐字段扫过）只有条目级 message / reasoning / function_call / function_call_output，加每条事件的 started_at / completed_at，再加一份 token_usage_record（input / cached / output / reasoning / total 这些数字），名字里带 delta 的字段一个都没有；连推理也只存摘要加加密块（加密块是给模型续跑用的，不是给人看的）。②再看框架：AgentScope 自家的 agentscope-service 把 EVENT_START / EVENT_DELTA 明确标成 Stream-only (never persisted)，被持久化的只有 agent.message / agent.thinking / agent.tool_use / agent.tool_result / span / 会话状态，和我们事实表那几类一一对应；框架的 TranscriptMiddleware 也是每轮结束把 AgentState.context 里的消息分段追加，不是 token。③再看需求：审计要的是口径 / 表 / 过滤 / 结果，评估要的是最终答案，都不需要逐字；排障要的那点东西本地 append-only 日志里本来就有（H-13 之后 7 天窗口内确实存着逐字事件）。④代价：一天 1 万轮乘 800 条 delta 就是 800 万行/天，块级只有约 10 万行/天，差 80 倍，而且逐字是高频小写入，正好把 H-13 的滚动与裁剪推回去"
